<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GRIMVALE — Necromancer's Almanac</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game">
  <canvas id="world" width="720" height="528"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <span id="hud-gold">⛁ 0</span>
    <span id="hud-time">Day 1 — 08:00</span>
    <span id="hud-moon">🌑</span>
    <span id="hud-loc">Grimvale</span>
  </div>

  <!-- Title screen -->
  <div id="title">
    <h1>GRIMVALE</h1>
    <p class="subtitle">a necromancer's almanac</p>
    <div class="title-menu">
      <button id="btn-new">NEW GAME</button>
      <button id="btn-continue">CONTINUE</button>
    </div>
    <p class="hint">Move: WASD / Arrows &nbsp;·&nbsp; Z: staff / interact &nbsp;·&nbsp; X: hex bolt &nbsp;·&nbsp; C: soul jar &nbsp;·&nbsp; Esc: menu</p>
  </div>

  <!-- Dialog box -->
  <div id="dialog" class="hidden">
    <div id="dialog-name"></div>
    <div id="dialog-text"></div>
    <div id="dialog-next">▼</div>
  </div>

  <!-- Choice box -->
  <div id="choice" class="hidden"></div>

  <!-- Generic menu panel (party, bag, shop, box...) -->
  <div id="panel" class="hidden"></div>

  <!-- Pause menu -->
  <div id="pause" class="hidden"></div>

  <!-- Vitals (real-time HUD) -->
  <div id="vitals" class="hidden">
    <div class="vbar"><div id="hp-fill" class="vfill hp"></div><span id="hp-txt"></span></div>
    <div class="vbar"><div id="soul-fill" class="vfill soul"></div><span id="soul-txt"></span></div>
    <div id="pack-txt"></div>
    <div id="keys-hint">Z staff &nbsp;X bolt &nbsp;C jar &nbsp;Esc menu</div>
  </div>

  <!-- Fishing: reel struggle minigame -->
  <div id="fishing" class="hidden">
    <div id="fish-title">~ something pulls the line! ~</div>
    <canvas id="fish-cv" width="220" height="300"></canvas>
    <div id="fish-hint">HOLD [A] to lift the hook — keep the fish in the green!</div>
  </div>

  <!-- Objective banner (tutorial) -->
  <div id="objective" class="hidden"><span id="obj-icon">◆</span> <span id="obj-text"></span></div>

  <div id="toast" class="hidden"></div>

</div>

<!-- Skill hotbar: 5 slots, keys 1-5 or tap -->
<div id="hotbar" class="hidden">
  <button class="hslot" data-i="0"><span class="hkey">1</span><span class="hicon"></span><div class="hcd"></div></button>
  <button class="hslot" data-i="1"><span class="hkey">2</span><span class="hicon"></span><div class="hcd"></div></button>
  <button class="hslot" data-i="2"><span class="hkey">3</span><span class="hicon"></span><div class="hcd"></div></button>
  <button class="hslot" data-i="3"><span class="hkey">4</span><span class="hicon"></span><div class="hcd"></div></button>
  <button class="hslot" data-i="4"><span class="hkey">5</span><span class="hicon"></span><div class="hcd"></div></button>
</div>

<!-- Touch controls (mobile / iPad): fixed to the viewport bezels,
     OUTSIDE the game frame so they can never cover game UI -->
<div id="touch" class="hidden">
  <button class="tbtn dbtn" data-key="ArrowUp"    id="d-up">▲</button>
  <button class="tbtn dbtn" data-key="ArrowLeft"  id="d-left">◀</button>
  <button class="tbtn dbtn" data-key="ArrowRight" id="d-right">▶</button>
  <button class="tbtn dbtn" data-key="ArrowDown"  id="d-down">▼</button>
  <button class="tbtn act" data-key="x" id="t-bolt">✦<small>BOLT</small></button>
  <button class="tbtn act" data-key="c" id="t-jar">◍<small>JAR</small></button>
  <button class="tbtn act big" data-key="z" id="t-a">⚔<small>A</small></button>
  <button class="tbtn menu" data-key="Escape" id="t-menu">☰</button>
</div>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/ui.js"></script>
<script src="js/combat.js"></script>
<script src="js/world.js"></script>

<script src="js/systems.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/main.js"></script>
</body>
</html>
